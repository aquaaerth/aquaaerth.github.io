<!DOCTYPE html>

<!-- vs: 5 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Directions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      color: #eaf2fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(15, 34, 51, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 28px 24px;
      max-width: 560px;
      width: 92%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    p {
      margin: 8px 0 18px;
      color: #cfe1f7;
      font-size: 15px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4FC3F7, #0288D1);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79,195,247,0.4);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .hint {
      font-size: 12px;
      color: #a9c4e0;
      margin-top: 14px;
    }

    textarea {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      border: 1px solid #2a475f;
      background: #0f2233;
      color: #eaf2fb;
      padding: 8px;
      font-size: 13px;
      margin-top: 8px;
      resize: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="javascript:history.back()">Go Back</a>
<br>
    <h1>Redirecting to Google Maps...</h1>

    <p><a id="go" class="btn" href="#" rel="noopener" target="_self">🚗 Open Google Maps</a></p>
    <p class="hint">If nothing happens, your browser may be blocking navigation.  
    You can copy the URL below and paste it into a new tab:</p>
    <textarea id="url" readonly></textarea>
  </div>

  <script>
    // Read ?to=<encoded URL>
    const params = new URLSearchParams(location.search);
    const to = params.get("to") || "";

    const go = document.getElementById("go");
    const ta = document.getElementById("url");

    if (to) {
      go.href = to;
      ta.value = to;
      // Auto-redirect after short delay
      setTimeout(() => { location.replace(to); }, 350);
    } else {
      go.textContent = "⚠️ Missing destination URL";
      go.classList.add("btn");
      go.style.opacity = 0.5;
    }
  </script>
</body>
</html>
