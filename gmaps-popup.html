<!DOCTYPE html>
<!-- gmaps-popup.html -->
<!-- vs: 2 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Maps Directions</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #111;
      color: #fff;
    }
    header {
      background: #222;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      color: #4FC3F7;
    }
    iframe {
      border: none;
      width: 100%;
      height: calc(100% - 40px);
    }
  </style>
</head>
<body>
  <header>Google Maps Directions</header>
  <iframe id="mapFrame" src=""></iframe>

  <script>
    // Parse ?to=<encoded-url> param
    const params = new URLSearchParams(window.location.search);
    const target = params.get("to");

    const frame = document.getElementById("mapFrame");
    if (target) {
      frame.src = decodeURIComponent(target);
    } else {
      document.body.innerHTML = "<p style='padding:1em'>No directions URL provided.</p>";
    }
  </script>
</body>
</html>
