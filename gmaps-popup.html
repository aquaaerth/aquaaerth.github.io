<!DOCTYPE html>
<!-- vs: 3 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Directions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Arial,sans-serif;background:#0b1520;color:#eaf2fb;}
    .wrap{max-width:560px;margin:0 auto;padding:24px;}
    h1{font-size:18px;margin:0 0 12px;}
    p{margin:8px 0 16px;color:#cfe1f7;}
    .btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#4FC3F7;color:#07263a;text-decoration:none;font-weight:600;}
    .btn:hover{background:#35b3ee;}
    .hint{font-size:12px;color:#a9c4e0;margin-top:10px;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Open in Google Maps</h1>
    <p>Click the button below to open directions.</p>
    <p><a id="go" class="btn" href="#" rel="noopener" target="_self">Open Google Maps</a></p>
    <p class="hint">If nothing happens, your browser may be blocking navigation. You can copy the URL below and paste it into a new tab.</p>
    <textarea id="url" style="width:100%;height:80px;border-radius:8px;border:1px solid #2a475f;background:#0f2233;color:#eaf2fb;padding:8px;"></textarea>
  </div>

  <script>
    // Read ?to=<encoded URL>
    const params = new URLSearchParams(location.search);
    const to = params.get("to") || "";

    const go = document.getElementById("go");
    const ta = document.getElementById("url");

    if (to) {
      go.href = to;
      ta.value = to;
      // Optional: auto-redirect after a short delay
      setTimeout(() => { location.replace(to); }, 250);
    } else {
      go.textContent = "Missing destination URL";
      go.className = "btn";
      go.style.opacity = 0.5;
    }
  </script>
</body>
</html>
