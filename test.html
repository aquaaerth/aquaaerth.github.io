<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AquaEarth KMZ Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: sans-serif;
    }
    #sidebar {
      width: 300px;
      height: 100%;
      float: left;
      background: #1e1e1e;
      color: #fff;
      padding: 10px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #sidebar h1 {
      margin: 0;
      font-size: 20px;
      color: #4FC3F7;
    }
    #sidebar h2 {
      margin: 2px 0 12px 0;
      font-size: 12px;
      font-weight: normal;
      color: #bbb;
    }
    #resetBtn {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      background: #444;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }
    #resetBtn:hover { background: #666; }
    #cesiumContainer {
      width: calc(100% - 300px);
      height: 100%;
      float: left;
    }
    #searchBox {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .tree ul { list-style: none; padding-left: 18px; margin: 4px 0; }
    .tree li { margin: 2px 0; cursor: pointer; }
    .folder::before { content: "▶ "; display: inline-block; transition: transform 0.2s; }
    .folder.expanded::before { transform: rotate(90deg); }
    .collapsed > ul { display: none; }
    .placemark::before { content: "• "; color: #00c3ff; }
    .placemark:hover { text-decoration: underline; color: #a3d3ff; }
    .hidden { display: none !important; }

    /* 🔹 Legend */
    #legend {
      margin-top: 12px;
      padding: 8px;
      background: #2a2a2a;
      border-radius: 6px;
      font-size: 13px;
    }
    #legend h4 { margin: 0 0 6px; font-size: 14px; color: #ddd; }
    .legend-item { display: flex; align-items: center; margin: 4px 0; }
    .legend-item img { width: 18px; height: 18px; margin-right: 6px; }

    /* 🔹 Info buttons */
    .info-btn {
      background: #4FC3F7;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      margin: 4px 4px 0 0;
      cursor: pointer;
      transition: background 0.2s;
    }
    .info-btn:hover { background: #0288D1; }
    .info-btn:active { background: #0277BD; }

    /* 🔹 Copied badge */
    .copy-confirm {
      display: inline-block;
      background: #4CAF50;
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      margin-top: 6px;
      margin-left: 2px;
      animation: fadeOut 2s forwards;
    }
    @keyframes fadeOut { 0%{opacity:1;}80%{opacity:1;}100%{opacity:0;} }

    /* 🔹 Toast system */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .toast {
      background: #323232;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      min-width: 160px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: slideIn 0.3s forwards, fadeOutToast 2s 1s forwards;
    }
    @keyframes slideIn {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fadeOutToast {
      to { opacity:0; transform:translateY(20px); }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <img src="https://aquavisitorsystem.github.io/aqua.png" width="250px" style="background-color:white;width:280px;">
    <h1>AquaEarth</h1>
    <h2>Protecting the World’s Water</h2>
    <button id="resetBtn">Reset</button>
    <input type="text" id="searchBox" placeholder="Search folders & placemarks...">
    <div class="tree" id="kmlTree">Loading KMZ structure...</div>
    <div id="legend"></div>
  </div>
  <div id="cesiumContainer"></div>
  <div id="toast-container"></div>

  <script>
   Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3NmEwNjdiZi02Y2E3LTQwNzEtYWRkMy03MjU1MTU3YWZmNTciLCJpZCI6MzQ1OTkyLCJpYXQiOjE3NTkyNDUyMTN9.C_4ZYmFZ-ShXYbhckuorrIbc_OlB1pwsyuAAdmJK3Ww";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
      timeline: false,
      animation: false
    });

    // ✅ safe event delegation for infoBox buttons
    document.addEventListener("click", function(e) {
      if (e.target.classList.contains("get-dir-btn")) {
        const lat = parseFloat(e.target.dataset.lat);
        const lon = parseFloat(e.target.dataset.lon);
        openDirections(lat, lon);
      }
      if (e.target.classList.contains("copy-addr-btn")) {
        const addr = e.target.dataset.addr;
        copyAddress(addr);
      }
    });

    viewer.camera.setView({
      destination: Cesium.Rectangle.fromDegrees(-125.0, 24.0, -66.0, 49.0)
    });

    const folderColorMap = {
      "Biological Installations": Cesium.Color.GREEN,
      "Filter Installations": Cesium.Color.ORANGE,
      "Tours": Cesium.Color.BLUE
    };

    const pinBuilder = new Cesium.PinBuilder();

    function getIconForEntity(entity) {
      let parent = entity.parent;
      while (parent) {
        if (parent.name && folderColorMap[parent.name]) {
          return pinBuilder.fromColor(folderColorMap[parent.name], 32).toDataURL();
        }
        parent = parent.parent;
      }
      return pinBuilder.fromColor(folderColorMap["AASI Installations"], 32).toDataURL();
    }

    const kmlUrl = "AASI Installations.kmz";
    Cesium.KmlDataSource.load(kmlUrl, { camera: viewer.scene.camera, canvas: viewer.scene.canvas })
      .then(function(dataSource) {
        viewer.dataSources.add(dataSource);
        dataSource.entities.values.forEach(entity => {
          if (entity.billboard) entity.billboard.image = getIconForEntity(entity);
        });

        const allEntities = dataSource.entities.values;
        const treeContainer = document.getElementById("kmlTree");
        treeContainer.innerHTML = "";

        const myPlaces = allEntities.find(e => e.name && e.name.trim() === "My Places");
        if (!myPlaces || !myPlaces._children) {
          treeContainer.textContent = "Could not find 'My Places' folder in KMZ.";
          return;
        }

        function buildTree(entities, parentEl) {
          const ul = document.createElement("ul");
          parentEl.appendChild(ul);
          entities.forEach(entity => {
            if (entity.show === false) return;
            const li = document.createElement("li");
            if (entity._children && entity._children.length > 0) {
              li.textContent = entity.name || "Folder";
              li.classList.add("folder", "collapsed");
              li.onclick = function(e) {
                e.stopPropagation();
                li.classList.toggle("collapsed");
                li.classList.toggle("expanded");
              };
              ul.appendChild(li);
              buildTree(entity._children, li);
            } else {
              li.textContent = entity.name || "Unnamed";
              li.classList.add("placemark");
              li.onclick = function(e) {
                e.stopPropagation();
                if (entity.position) {
                  viewer.flyTo(entity, { duration: 2.0 });
                  viewer.selectedEntity = entity;
                }
              };
              ul.appendChild(li);
            }
          });
        }

        const myRoot = document.createElement("div");
        myRoot.textContent = "AASI Installations";
        myRoot.classList.add("folder", "expanded");
        treeContainer.appendChild(myRoot);
        buildTree(myPlaces._children, myRoot);
      });

    // 🔹 Replace placeholder with buttons using data attributes
    function replacePlaceholderWithAddress(entity, info) {
      const { address, lat, lon } = info;
      let html = entity.description?.getValue?.() ?? entity.description ?? "";
      if (typeof html !== "string") html = String(html);

      const btns = `
        <button class="info-btn get-dir-btn" data-lat="${lat}" data-lon="${lon}">Get directions</button>
        <button class="info-btn copy-addr-btn" data-addr="${address.replace(/"/g,"&quot;")}">Copy address</button>`;

      if (html.includes("Fetching address…")) {
        html = html.replace(/<b>Address:<\/b>.*?<\/div>/s, `<b>Address:</b> ${address}<br>${btns}</div>`);
      } else if (!html.includes("Address:")) {
        html += `<hr><div style="font:12px system-ui,Arial;color:#444"><b>Address:</b> ${address}<br>${btns}</div>`;
      }
      entity.description = new Cesium.ConstantProperty(html);
    }

    // 🔹 Global functions
    function openDirections(lat, lon) {
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
      const w=800,h=600,left=(screen.width/2)-(w/2),top=(screen.height/2)-(h/2);
      showToast("🌍 Opening Google Maps…");
      window.open(mapsUrl,"Directions",`width=${w},height=${h},top=${top},left=${left},resizable=yes,scrollbars=yes`);
    }

    function copyAddress(addr) {
      navigator.clipboard.writeText(addr).then(() => {
        showToast("✓ Address copied to clipboard!");
        const infoBox = document.querySelector(".cesium-infoBox-description");
        if (infoBox) {
          let msg = infoBox.querySelector(".copy-confirm");
          if (msg) msg.remove();
          msg = document.createElement("div");
          msg.className="copy-confirm";
          msg.textContent="✓ Copied!";
          infoBox.appendChild(msg);
          setTimeout(()=>{ if(msg&&msg.parentNode) msg.remove(); },2000);
        }
      }).catch(()=>showToast("⚠ Copy failed",true));
    }

    function showToast(message,isError=false) {
      const container=document.getElementById("toast-container");
      const toast=document.createElement("div");
      toast.className="toast";
      toast.textContent=message;
      if(isError) toast.style.background="#d32f2f";
      container.appendChild(toast);
      setTimeout(()=>{ if(toast&&toast.parentNode) container.removeChild(toast); },3000);
    }
  </script>
</body>
</html>
