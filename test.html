<!DOCTYPE html>
<!-- vs: 553 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AquaEarth KMZ Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; font-family:sans-serif; }
    #app { display:flex; flex-direction:row; height:100%; }

    /* Sidebar */
    #sidebar {
      width:300px; min-width:260px;
      background:#1e1e1e; color:#fff;
      display:flex; flex-direction:column;
      padding:0; overflow:hidden;
      transition:transform 0.3s ease;
      z-index:1000;
    }
    #sidebarHeader {
      background:#1e1e1e;
      padding:10px;
      position:sticky;
      top:0;
      z-index:10;
      border-bottom:1px solid #333;
    }
    #sidebarHeader h1 { margin:0; font-size:20px; color:#4FC3F7; }
    #sidebarHeader h2 { margin:2px 0 12px 0; font-size:12px; font-weight:normal; color:#bbb; }
    #resetBtn {
      width:100%; padding:10px; margin-bottom:10px; background:#444;
      border:none; border-radius:6px; color:#fff; cursor:pointer; font-size:14px;
    }
    #resetBtn:hover { background:#666; }
    #searchBox { width:100%; padding:8px; margin-bottom:10px; border:none; border-radius:6px; font-size:14px; }

    #sidebarContent {
      flex:1;
      overflow-y:auto;
      padding:10px;
    }

    /* Tree */
    .tree ul { list-style:none; padding-left:18px; margin:4px 0; }
    .tree li { margin:2px 0; cursor:pointer; }
    .folder::before { content:"▶ "; display:inline-block; transition:transform 0.2s; }
    .folder.expanded::before { transform:rotate(90deg); }
    .collapsed > ul { display:none; }
    .placemark::before { content:"• "; color:#00c3ff; }
    .placemark:hover { text-decoration:underline; color:#a3d3ff; }
    .hidden { display:none !important; }

    /* Legend */
    #legend { margin-top:12px; padding:8px; background:#2a2a2a; border-radius:6px; font-size:13px; }
    #legend h4 { margin:0 0 6px; font-size:14px; color:#ddd; }
    .legend-item { display:flex; align-items:center; margin:4px 0; }
    .legend-item img { width:18px; height:18px; margin-right:6px; }

    /* Spinner */
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .spinner { width:12px; height:12px; border:2px solid #ccc; border-top:2px solid #444;
      border-radius:50%; display:inline-block; animation:spin 1s linear infinite; }

    .directions-text { color:#fff; font-weight:bold; font-size:12px; }

    /* Map container */
    #cesiumContainer { flex:1; height:100%; }

    /* Mobile adjustments */
    #menuToggle {
      display:none; position:absolute; top:10px; left:10px; z-index:1500;
      background:#4FC3F7; color:#07263a; border:none; padding:8px 12px;
      border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer;
    }
    @media (max-width:768px) {
      #sidebar {
        position:absolute; top:0; left:0; bottom:0; transform:translateX(-100%);
        box-shadow:2px 0 6px rgba(0,0,0,0.5);
      }
      #sidebar.open { transform:translateX(0); }
      #menuToggle { display:block; }
      #cesiumContainer { width:100%; }
    }

    /* InfoBox container min/max */
    .cesium-infoBox.cesium-infoBox-visible {
      height: auto !important;
      min-height: 230px !important;
      max-height: 70vh !important;
    }
    .cesium-infoBox-body {
      max-height: 70vh !important;
      overflow-y: auto !important;
    }

    /* InfoBox description min/max */
    .cesium-infoBox-description {
      min-height: 230px !important;
      max-height: 70vh !important;
      overflow-y: auto !important;
    }

    /* InfoBox iframe min/max */
    .cesium-infoBox-iframe {
      min-height: 230px !important;
      max-height: 70vh !important;
      overflow-y: auto !important;
    }
  </style>
</head>
<body>
  <button id="menuToggle">☰ Menu</button>
  <div id="app">
    <div id="sidebar">
      <!-- Docked header -->
      <div id="sidebarHeader">
        <img src="https://aquavisitorsystem.github.io/aqua.png" width="100%" style="background-color:white; border-radius:4px;">
        <h1>AquaEarth</h1>
        <h2>Protecting the World’s Water</h2>

        <button id="resetBtn">Reset</button>
        <input type="text" id="searchBox" placeholder="Search folders & placemarks...">
      </div>

      <!-- Scrollable content -->
      <div id="sidebarContent">
        <div class="tree" id="kmlTree">Loading KMZ structure...</div>
        <div id="legend"></div>
      </div>
    </div>
    <div id="cesiumContainer"></div>
  </div>

  <script>
  window.addEventListener("load", () => {
    console.log("AquaEarth KMZ Viewer v553"); // ✅ version stamp in console

    const menuToggle=document.getElementById("menuToggle");
    const sidebar=document.getElementById("sidebar");
    menuToggle.addEventListener("click",()=>sidebar.classList.toggle("open"));

        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3NmEwNjdiZi02Y2E3LTQwNzEtYWRkMy03MjU1MTU3YWZmNTciLCJpZCI6MzQ1OTkyLCJpYXQiOjE3NTkyNDUyMTN9.C_4ZYmFZ-ShXYbhckuorrIbc_OlB1pwsyuAAdmJK3Ww";

    const viewer=new Cesium.Viewer("cesiumContainer",{baseLayerPicker:false,timeline:false,animation:false});

    // --- shared openDirections function ---
    function openDirections() {
      if (!_currentDirectionsUrl) return;
      const isMobile = /Mobi|Android/i.test(navigator.userAgent);
        // 💻 Desktop: popup window
        const proxy = `gmaps-popup.html?to=${encodeURIComponent(_currentDirectionsUrl)}`;
        const w = 800, h = 600, left = (screen.width - w) / 2, top = (screen.height - h) / 2;
        const win = window.open(proxy,"DirectionsPopup",
          `width=${w},height=${h},top=${top},left=${left},resizable=yes,scrollbars=yes`);
        if (!win) alert("Popup was blocked. Please allow popups for this site.");
      }

    // Hook into InfoBox iframe
    viewer.infoBox.frame.addEventListener("load", () => {
      const f = viewer.infoBox.frame;
      f.setAttribute("sandbox","allow-same-origin allow-popups allow-top-navigation-by-user-activation");

      const doc = f.contentDocument || f.contentWindow.document;

      // --- Auto-resize InfoBox ---
      const resizeInfoBox = () => {
        const box = document.querySelector(".cesium-infoBox.cesium-infoBox-visible");
        if (box) {
          const innerHeight = doc.body.scrollHeight;
          const capped = Math.min(innerHeight, window.innerHeight * 0.7);
          const finalHeight = Math.max(capped, 230);
          box.style.height = finalHeight + "px";
        }
      };
      resizeInfoBox();
      const mo = new MutationObserver(resizeInfoBox);
      mo.observe(doc.body, { childList: true, subtree: true, characterData: true });

      // --- Inject popupBtn2 inside iframe ---
      if (!doc.getElementById("popupBtn2")) {
        const style = doc.createElement("style");
        style.textContent = `
          #popupBtn2 {
            display: block;
            margin: 15px auto 0 auto;
            padding: 8px 8px;
            background: #444;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            min-width: 160px;
            text-align: center;
          }
          #popupBtn2:hover { background:#666; }
          #popupBtn2:disabled { opacity:0.5; cursor:not-allowed; }
        `;
        doc.head.appendChild(style);

        const btn2 = doc.createElement("button");
        btn2.id = "popupBtn2";
        btn2.textContent = "Get directions";
        btn2.disabled = true;
        doc.body.appendChild(btn2);

        btn2.addEventListener("click", openDirections);
      }
    });

    viewer.camera.setView({destination:Cesium.Rectangle.fromDegrees(-125,24,-66,49)});

    const folderColorMap={"Biological Installations":Cesium.Color.GREEN,"Filter Installations":Cesium.Color.ORANGE,"Tours":Cesium.Color.BLUE};
    const pinBuilder=new Cesium.PinBuilder();
    function getIconForEntity(entity){
      let parent=entity.parent;
      while(parent){
        if(parent.name&&folderColorMap[parent.name]){
          return pinBuilder.fromColor(folderColorMap[parent.name],32).toDataURL();
        }
        parent=parent.parent;
      }
      return pinBuilder.fromColor(Cesium.Color.CYAN,32).toDataURL();
    }

    const kmlUrl="AASI Installations.kmz";
    Cesium.KmlDataSource.load(kmlUrl,{camera:viewer.scene.camera,canvas:viewer.scene.canvas}).then(ds=>{
      viewer.dataSources.add(ds);
      ds.entities.values.forEach(e=>{ if(e.billboard) e.billboard.image=getIconForEntity(e); });

      const treeContainer=document.getElementById("kmlTree");
      treeContainer.innerHTML="";
      const myPlaces=ds.entities.values.find(e=>e.name&&e.name.trim()==="My Places");
      if(!myPlaces||!myPlaces._children){ treeContainer.textContent="No 'My Places'"; return; }

      function buildTree(entities,parentEl){
        const ul=document.createElement("ul"); parentEl.appendChild(ul);
        entities.forEach(entity=>{
          if(entity.show===false) return;
          const li=document.createElement("li");
          if(entity._children&&entity._children.length>0){
            li.textContent=entity.name||"Folder";
            li.classList.add("folder","collapsed");
            li.onclick=e=>{ e.stopPropagation(); li.classList.toggle("collapsed"); li.classList.toggle("expanded"); };
            ul.appendChild(li); buildTree(entity._children,li);
          } else {
            li.textContent=entity.name||"Unnamed";
            li.classList.add("placemark");
            li.onclick=e=>{
              e.stopPropagation();
              if(entity.position){
                viewer.flyTo(entity,{duration:2});
                viewer.selectedEntity=entity;
              }
              if(window.innerWidth<=768){ sidebar.classList.remove("open"); }
            };
            ul.appendChild(li);
          }
        });
      }
      const myRoot=document.createElement("div");
      myRoot.textContent="AASI Installations"; myRoot.classList.add("folder","expanded");
      treeContainer.appendChild(myRoot);
      buildTree(myPlaces._children,myRoot);

      /* === Search filter === */
      document.getElementById("searchBox").addEventListener("input",function(){
        const term=this.value.toLowerCase();
        const allNodes=treeContainer.querySelectorAll("li,div.folder");
        allNodes.forEach(el=>el.classList.remove("hidden"));
        if(term===""){ 
          viewer.camera.setView({destination:Cesium.Rectangle.fromDegrees(-125,24,-66,49)});
          const folders=treeContainer.querySelectorAll(".folder");
          folders.forEach((f,i)=>{ 
            if(i===0){ f.classList.add("expanded"); f.classList.remove("collapsed"); }
            else { f.classList.add("collapsed"); f.classList.remove("expanded"); }
            f.classList.remove("hidden"); 
          });
          treeContainer.querySelectorAll(".placemark").forEach(pm=>pm.classList.remove("hidden"));
          return;
        }
        allNodes.forEach(el=>{
          const text=el.textContent.toLowerCase();
          if(el.classList.contains("folder")){
            if(text.includes(term)){ 
              el.classList.add("expanded"); el.classList.remove("collapsed");
              el.querySelectorAll("li,div").forEach(d=>d.classList.remove("hidden"));
            } else {
              let has=false; el.querySelectorAll("li,div").forEach(ch=>{ if(ch.textContent.toLowerCase().includes(term)) has=true; });
              if(!has) el.classList.add("hidden");
            }
          }
          if(el.classList.contains("placemark")){
            if(text.includes(term)){
              let p=el.parentElement; 
              while(p&&p!==treeContainer){ 
                if(p.classList.contains("folder")){ 
                  p.classList.add("expanded"); 
                  p.classList.remove("collapsed"); 
                  p.classList.remove("hidden"); 
                } 
                p=p.parentElement; 
              }
            } else {
              let pf=el.closest(".folder"); 
              if(!pf||!pf.textContent.toLowerCase().includes(term)) el.classList.add("hidden");
            }
          }
        });
      });
    });

    document.getElementById("resetBtn").addEventListener("click",()=>location.reload());
    Array.from(document.getElementsByClassName('cesium-viewer-bottom')).forEach(b=>b.style.display='none');

    /* ==== Address + Google Directions ==== */
    const _addrCache=new Map();
    let _currentDirectionsUrl="";

    viewer.selectedEntityChanged.addEventListener(entity=>{
      if(!entity||!entity.position) return;
      addAddress(entity);
    });

    async function addAddress(entity){
      let html=entity.description?.getValue?.()??entity.description??"";
      if(typeof html!=="string") html=String(html);
      if(html.includes("Address:")||html.includes("Fetching address")) return;

      html+=`
        <hr><div style="font:12px system-ui;color:#bbb">
          <b>Address:</b><br><span class="spinner"></span> Fetching address...
        </div>`;
      entity.description=new Cesium.ConstantProperty(html);

      const carto=Cesium.Cartographic.fromCartesian(entity.position.getValue(Cesium.JulianDate.now()));
      const lat=Cesium.Math.toDegrees(carto.latitude), lon=Cesium.Math.toDegrees(carto.longitude);
      const key=`${lat.toFixed(6)},${lon.toFixed(6)}`;
      if(_addrCache.has(key)){ replace(entity,_addrCache.get(key)); return; }

      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
        const j=await r.json();
        const info={address:j.display_name,lat,lon};
        _addrCache.set(key,info);
        replace(entity,info);
      }catch(e){ console.warn("geocode fail",e); }
    }

    function replace(entity,{address,lat,lon}){
      let html=entity.description?.getValue?.()??entity.description??"";
      const gUrl=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

      const infoBoxLine=`<span class="directions-text">${address}<br></span>`;
      html=html.replace('<span class="spinner"></span> Fetching address...',infoBoxLine);
      entity.description=new Cesium.ConstantProperty(html);

      _currentDirectionsUrl=gUrl;

      // Enable InfoBox button
      const doc = viewer.infoBox.frame.contentDocument || viewer.infoBox.frame.contentWindow.document;
      const btn2 = doc.getElementById("popupBtn2");
      if (btn2) btn2.disabled = false;
    }
  });
  </script>
</body>
</html>
