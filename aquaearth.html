<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AquaEarth KMZ Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: sans-serif;
    }
    #sidebar {
      width: 300px;
      height: 100%;
      float: left;
      background: #1e1e1e;
      color: #fff;
      padding: 10px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #cesiumContainer {
      width: calc(100% - 300px);
      height: 100%;
      float: left;
    }
    .layer-btn {
      display: block;
      margin: 8px 0;
      padding: 6px 10px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
    }
    .layer-btn:hover {
      background: #444;
    }
    .tree ul {
      list-style: none;
      padding-left: 18px;
      margin: 4px 0;
    }
    .tree li {
      margin: 2px 0;
      cursor: pointer;
    }
    .folder::before {
      content: "▶ ";
      display: inline-block;
      transition: transform 0.2s;
    }
    .folder.expanded::before {
      transform: rotate(90deg);
    }
    .collapsed > ul {
      display: none;
    }
    .placemark:hover {
      text-decoration: underline;
      color: #a3d3ff;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>Imagery Layers</h3>
    <button class="layer-btn" onclick="setWorldImagery()">🌍 World Imagery</button>
    <button class="layer-btn" onclick="setOSM()">🗺️ OpenStreetMap</button>
    <button class="layer-btn" onclick="setESRI()">🛰️ ESRI Satellite</button>

    <h3>KMZ/KML Layers</h3>
    <div class="tree" id="kmlTree">Loading KMZ structure...</div>
  </div>
  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3NmEwNjdiZi02Y2E3LTQwNzEtYWRkMy03MjU1MTU3YWZmNTciLCJpZCI6MzQ1OTkyLCJpYXQiOjE3NTkyNDUyMTN9.C_4ZYmFZ-ShXYbhckuorrIbc_OlB1pwsyuAAdmJK3Ww";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
      timeline: false,
      animation: false
    });

    let activeLayer;

    // Imagery switching
    function switchLayer(newProviderPromise) {
      if (activeLayer) {
        viewer.imageryLayers.remove(activeLayer);
        activeLayer = undefined;
      }
      if (newProviderPromise.then) {
        newProviderPromise.then(provider => {
          activeLayer = viewer.imageryLayers.addImageryProvider(provider);
        });
      } else {
        activeLayer = viewer.imageryLayers.addImageryProvider(newProviderPromise);
      }
    }
    function setWorldImagery() {
      switchLayer(Cesium.createWorldImageryAsync());
    }
    function setOSM() {
      switchLayer(new Cesium.OpenStreetMapImageryProvider());
    }
    function setESRI() {
      switchLayer(new Cesium.UrlTemplateImageryProvider({
        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      }));
    }
    setWorldImagery(); // default

    // ---- KMZ/KML Loading ----
    const kmlUrl = "AASI Installations.kmz"; // 🔹 Replace with your KMZ/KML path
    Cesium.KmlDataSource.load(kmlUrl, { camera: viewer.scene.camera, canvas: viewer.scene.canvas })
      .then(function(dataSource) {
        viewer.dataSources.add(dataSource);
        viewer.zoomTo(dataSource);

        const rootEntities = dataSource.entities.values;
        const treeContainer = document.getElementById("kmlTree");
        treeContainer.innerHTML = ""; // clear loading text

        // Recursive tree builder
        function buildTree(entities, parentEl) {
          const ul = document.createElement("ul");
          parentEl.appendChild(ul);

          entities.forEach(entity => {
            const li = document.createElement("li");

            if (entity._children && entity._children.length > 0) {
              li.textContent = entity.name || "Folder";
              li.classList.add("folder", "collapsed");

              li.onclick = function(e) {
                e.stopPropagation();
                li.classList.toggle("collapsed");
                li.classList.toggle("expanded");
              };

              ul.appendChild(li);
              buildTree(entity._children, li);
            } else {
              li.textContent = entity.name || "Unnamed";
              li.classList.add("placemark");

              li.onclick = function(e) {
                e.stopPropagation();
                if (entity.position) {
                  viewer.flyTo(entity, {
                    duration: 2.0
                  });
                }
              };

              ul.appendChild(li);
            }
          });
        }

        buildTree(rootEntities, treeContainer);
      })
      .catch(function(error) {
        document.getElementById("kmlTree").textContent = "Error loading KMZ: " + error;
        console.error(error);
      });
  </script>
</body>
</html>
