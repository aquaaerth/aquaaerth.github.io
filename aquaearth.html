<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AquaEarth KMZ Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

   <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: sans-serif;
    }
    #sidebar {
      width: 300px;
      height: 100%;
      float: left;
      background: #1e1e1e;
      color: #fff;
      padding: 10px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #sidebar h1 {
      margin: 0;
      font-size: 20px;
      color: #4FC3F7; /* Aqua-blue */
    }
    #sidebar h2 {
      margin: 2px 0 12px 0;
      font-size: 12px;
      font-weight: normal;
      color: #bbb;
    }
    #resetBtn {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      background: #444;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }
    #resetBtn:hover {
      background: #666;
    }
    #cesiumContainer {
      width: calc(100% - 300px);
      height: 100%;
      float: left;
    }
    #searchBox {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .tree ul {
      list-style: none;
      padding-left: 18px;
      margin: 4px 0;
    }
    .tree li {
      margin: 2px 0;
      cursor: pointer;
    }
    .folder::before {
      content: "▶ ";
      display: inline-block;
      transition: transform 0.2s;
    }
    .folder.expanded::before {
      transform: rotate(90deg);
    }
    .collapsed > ul {
      display: none;
    }
    .placemark::before {
      content: "• ";
      color: #00c3ff;
    }
    .placemark:hover {
      text-decoration: underline;
      color: #a3d3ff;
    }
    .hidden {
      display: none !important;
    }
    /* 🔹 Legend */
    #legend {
      margin-top: 12px;
      padding: 8px;
      background: #2a2a2a;
      border-radius: 6px;
      font-size: 13px;
    }
    #legend h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #ddd;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }
    .legend-item img {
      width: 18px;
      height: 18px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="sidebar">
  <!-- 🔹 Title and Subtitle -->
	<img src="https://aquavisitorsystem.github.io/aqua.png" width="250px" style="background-color: white;width: 280px;">
    <h1>AquaEarth</h1>
    <h2>Protecting the World’s Water</h2>

    <!-- 🔹 Reset Button -->
    <button id="resetBtn">Reset</button>
    <input type="text" id="searchBox" placeholder="Search folders & placemarks...">
    <div class="tree" id="kmlTree">Loading KMZ structure...</div>
    <div id="legend"></div>
  </div>
  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3NmEwNjdiZi02Y2E3LTQwNzEtYWRkMy03MjU1MTU3YWZmNTciLCJpZCI6MzQ1OTkyLCJpYXQiOjE3NTkyNDUyMTN9.C_4ZYmFZ-ShXYbhckuorrIbc_OlB1pwsyuAAdmJK3Ww";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
      timeline: false,
      animation: false
    });

    // ✅ Default view to continental United States
    viewer.camera.setView({
      destination: Cesium.Rectangle.fromDegrees(-125.0, 24.0, -66.0, 49.0)
    });

    // 🔹 Fixed folder → color mapping
    const folderColorMap = {
      "Biological Installations": Cesium.Color.GREEN,
      "Filter Installations": Cesium.Color.ORANGE,
      "Tours": Cesium.Color.BLUE
    };

    const pinBuilder = new Cesium.PinBuilder();

    // Always return a pin for placemarks
    function getIconForEntity(entity) {
      let parent = entity.parent;
      while (parent) {
        if (parent.name && folderColorMap[parent.name]) {
          return pinBuilder.fromColor(folderColorMap[parent.name], 32).toDataURL();
        }
        parent = parent.parent;
      }
      // fallback to root
      return pinBuilder.fromColor(folderColorMap["AASI Installations"], 32).toDataURL();
    }

    const kmlUrl = "AASI Installations.kmz"; // 🔹 Replace with your KMZ/KML path
    Cesium.KmlDataSource.load(kmlUrl, { camera: viewer.scene.camera, canvas: viewer.scene.canvas })
      .then(function(dataSource) {
        viewer.dataSources.add(dataSource);

        // 🔧 Force icon for every placemark
        dataSource.entities.values.forEach(entity => {
          if (entity.billboard) {
            entity.billboard.image = getIconForEntity(entity);
          }
        });

        const allEntities = dataSource.entities.values;
        const treeContainer = document.getElementById("kmlTree");
        treeContainer.innerHTML = ""; // clear loading text

        // 🔍 Find the "My Places" folder entity
        const myPlaces = allEntities.find(e => e.name && e.name.trim() === "My Places");

        if (!myPlaces || !myPlaces._children) {
          treeContainer.textContent = "Could not find 'My Places' folder in KMZ.";
          return;
        }

        // Recursive tree builder
        function buildTree(entities, parentEl) {
  const ul = document.createElement("ul");
  parentEl.appendChild(ul);

  entities.forEach(entity => {
    // Skip hidden entities (visibility=0 in KMZ)
    if (entity.show === false) return;

    const li = document.createElement("li");

    if (entity._children && entity._children.length > 0) {
      li.textContent = entity.name || "Folder";
      li.classList.add("folder", "collapsed");

      li.onclick = function(e) {
        e.stopPropagation();
        li.classList.toggle("collapsed");
        li.classList.toggle("expanded");
      };

      ul.appendChild(li);
      buildTree(entity._children, li);
    } else {
      li.textContent = entity.name || "Unnamed";
      li.classList.add("placemark");

      li.onclick = function(e) {
        e.stopPropagation();
        if (entity.position) {
          viewer.flyTo(entity, { duration: 2.0 });
        }
      };

      ul.appendChild(li);
    }
  });
}


        // Build tree ONLY from "My Places", but rename root
        const myRoot = document.createElement("div");
        myRoot.textContent = "AASI Installations";
        myRoot.classList.add("folder", "expanded");
        treeContainer.appendChild(myRoot);

        buildTree(myPlaces._children, myRoot);

        // 🔎 Search filter
        const searchBox = document.getElementById("searchBox");
        searchBox.addEventListener("input", function() {
          const term = this.value.toLowerCase();

          const allNodes = treeContainer.querySelectorAll("li, div.folder");
          allNodes.forEach(el => el.classList.remove("hidden"));

          if (term === "") return;

          allNodes.forEach(el => {
            const text = el.textContent.toLowerCase();

            if (el.classList.contains("folder")) {
              if (text.includes(term)) {
                el.classList.add("expanded");
                el.classList.remove("collapsed");
                const descendants = el.querySelectorAll("li, div");
                descendants.forEach(d => d.classList.remove("hidden"));
              } else {
                let hasMatchingDescendant = false;
                el.querySelectorAll("li, div").forEach(child => {
                  if (child.textContent.toLowerCase().includes(term)) {
                    hasMatchingDescendant = true;
                  }
                });
                if (!hasMatchingDescendant) {
                  el.classList.add("hidden");
                } else {
                  el.classList.add("expanded");
                  el.classList.remove("collapsed");
                }
              }
            }

            if (el.classList.contains("placemark")) {
              if (text.includes(term)) {
                let parent = el.parentElement;
                while (parent && parent !== treeContainer) {
                  if (parent.classList.contains("folder")) {
                    parent.classList.add("expanded");
                    parent.classList.remove("collapsed");
                    parent.classList.remove("hidden");
                  }
                  parent = parent.parentElement;
                }
              } else {
                let parentFolder = el.closest(".folder");
                if (!parentFolder || !parentFolder.textContent.toLowerCase().includes(term)) {
                  el.classList.add("hidden");
                }
              }
            }
          });
        });

        // ✅ Build legend dynamically
        const legendContainer = document.getElementById("legend");
        legendContainer.innerHTML = "<h4>Legend</h4>";
        Object.keys(folderColorMap).forEach(folderName => {
          const color = folderColorMap[folderName] || Cesium.Color.BLUE;
          const pinUrl = pinBuilder.fromColor(color, 24).toDataURL();
          const div = document.createElement("div");
          div.classList.add("legend-item");
          div.innerHTML = `<img src="${pinUrl}"> ${folderName}`;
          legendContainer.appendChild(div);
        });
      })
      .catch(function(error) {
        document.getElementById("kmlTree").textContent = "Error loading KMZ: " + error;
        console.error(error);
      });
	  
	   // 🔹 Reset function (reload page completely)
    function resetView() {
      location.reload();
    }

    // Hook Reset button
    document.getElementById("resetBtn").addEventListener("click", resetView);
	var appBanners = document.getElementsByClassName('cesium-viewer-bottom');

for (var i = 0; i < appBanners.length; i ++) {
    appBanners[i].style.display = 'none';
}
  </script>
</body>
</html>
