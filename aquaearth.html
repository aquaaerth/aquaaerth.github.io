<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Google Earth Web App - KMZ Loader</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/CesiumUnminified/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: sans-serif;
    }
    #cesiumContainer {
      width: calc(100% - 280px);
      height: 100%;
      float: left;
    }
    #sidebar {
      width: 280px;
      height: 100%;
      float: right;
      background: #1e1e1e;
      color: white;
      overflow-y: auto;
      padding: 10px;
    }
    #sidebar h2 {
      margin-top: 0;
      font-size: 16px;
    }
    #sidebar ul {
      list-style: none;
      padding: 0;
    }
    #sidebar li {
      margin: 6px 0;
      padding: 6px;
      cursor: pointer;
      background: #333;
      border-radius: 4px;
    }
    #sidebar li:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="sidebar">
    <h2>Locations</h2>
    <ul id="locationList"></ul>
  </div>

  <script>
    const DEFAULT_KMZ_URL = "https://aquaaerth.github.io/AASI%20Installations.kmz";

    Cesium.Ion.defaultAccessToken = "YOUR_TOKEN_HERE";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false,
      animation: false,
    });

    // Load KMZ/KML and populate sidebar list
    function loadKmlKmz(sourceUrl) {
      Cesium.KmlDataSource.load(sourceUrl, {
        camera: viewer.scene.camera,
        canvas: viewer.scene.canvas,
      }).then(function (dataSource) {
        viewer.dataSources.add(dataSource);
        viewer.flyTo(dataSource);

        const entities = dataSource.entities.values;
        const list = document.getElementById("locationList");
        list.innerHTML = "";

        entities.forEach(entity => {
          if (entity.name) {
            const li = document.createElement("li");
            li.textContent = entity.name;
            li.addEventListener("click", () => {
              viewer.flyTo(entity);
            });
            list.appendChild(li);
          }
        });
      }).catch(err => console.error("Error loading KMZ/KML:", err));
    }

    // Auto-load default KMZ
    loadKmlKmz(DEFAULT_KMZ_URL);
  </script>
</body>
</html>
