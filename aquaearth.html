<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AquaEarth KMZ Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: sans-serif;
    }
    #sidebar {
      width: 250px;
      height: 100%;
      float: left;
      background: #1e1e1e;
      color: #fff;
      padding: 10px;
      box-sizing: border-box;
    }
    #cesiumContainer {
      width: calc(100% - 250px);
      height: 100%;
      float: left;
    }
    .layer-btn {
      display: block;
      margin: 8px 0;
      padding: 6px 10px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
    }
    .layer-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3>Imagery Layers</h3>
    <button class="layer-btn" onclick="setWorldImagery()">🌍 World Imagery</button>
    <button class="layer-btn" onclick="setOSM()">🗺️ OpenStreetMap</button>
    <button class="layer-btn" onclick="setESRI()">🛰️ ESRI Satellite</button>
  </div>
  <div id="cesiumContainer"></div>

  <script>
    // ✅ Set your Cesium ion token here
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3NmEwNjdiZi02Y2E3LTQwNzEtYWRkMy03MjU1MTU3YWZmNTciLCJpZCI6MzQ1OTkyLCJpYXQiOjE3NTkyNDUyMTN9.C_4ZYmFZ-ShXYbhckuorrIbc_OlB1pwsyuAAdmJK3Ww";

    // Create viewer
    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayerPicker: false,
      timeline: false,
      animation: false
    });

    let activeLayer;

    // Remove current layer before adding new one
    function switchLayer(newProviderPromise) {
      if (activeLayer) {
        viewer.imageryLayers.remove(activeLayer);
        activeLayer = undefined;
      }

      // providerPromise may be sync or async
      if (newProviderPromise.then) {
        newProviderPromise.then(provider => {
          activeLayer = viewer.imageryLayers.addImageryProvider(provider);
        });
      } else {
        activeLayer = viewer.imageryLayers.addImageryProvider(newProviderPromise);
      }
    }

    // ✅ Layer options
    function setWorldImagery() {
      switchLayer(Cesium.createWorldImageryAsync());
    }

    function setOSM() {
      switchLayer(new Cesium.OpenStreetMapImageryProvider());
    }

    function setESRI() {
      switchLayer(new Cesium.UrlTemplateImageryProvider({
        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      }));
    }

    // Load default
    setWorldImagery();
  </script>
</body>
</html>
