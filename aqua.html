<html><head>
  <meta charset="UTF-8">
  <meta name="description" content="Aqua Earth" "="">
  <meta name="keywords" content="Aqua Earth">
  <meta name="author" content="Chuck Konkol">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
 <title>AquaEarth - Web/Mobile App Version</title>
  <style>
    /* Initial styling */
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform: scale(1);
      transform-origin: top left;
    }
    /* Media query for smaller screens */
    @media (max-width: 767px) {
      html {
        transform: scale(0.8);
      }
    }
  </style>
</head>
<body>
  <img src="https://aquavisitorsystem.github.io/aqua.png" width="250px"><br>
  <h1 style="font-size: 30px;">AquaEarth Secure Login</h1>
  <form id="loginForm">
    <label style="font-size: 20px;" for="username">Login:</label><br>
    <input style="font-size: 20px;" type="text" id="username" required><br><br>
    <label style="font-size: 20px;" for="accessCode">Access Code:</label><br>
    <input style="font-size: 20px;" type="password" id="accessCode" required><br><br>
    <button style="font-size: 20px;" id="submit" type="submit">Login</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc,collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyCQaPz_Ph1xEKQP6rb6FlRY7haL9_ns8wk",
  authDomain: "aqua-earth-b2da7.firebaseapp.com",
        projectId: "aqua-earth-b2da7",
  storageBucket: "aqua-earth-b2da7.firebasestorage.app",
  messagingSenderId: "794773574573",
  appId: "1:794773574573:web:966db3e78218ea69b40724"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);




 

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const accessCode = document.getElementById('accessCode').value;

      try {
        const userRef = doc(db, "users", username);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const storedCode = userSnap.data().accessCode;
          if (storedCode === accessCode) {
         
            //alert("Login successful!");

            // Log successful login
        await addDoc(collection(db, "login_logs"), {
    username: username,
    timestamp: serverTimestamp(),
    status: "success accessing AquaEarth page",
    userAgent: navigator.userAgent
  });
            const myHTML = "'" + userSnap.data().app + "'";
            createAndOpenHTML(myHTML);
           // const blob = new Blob([userSnap.data().app], { type: 'text/html' });
           //const url = URL.createObjectURL(blob);
//   alert(url);
   //var link = document.createElement("a")
  //link.href = url
 // link.target = "_blank"
 // link.click()
           // window.open(url, '_blank');
          } else {
           
            alert("Incorrect access code.");
          }
        } else {
         
          alert("User not found.");
        }
      } catch (err) {
    
        console.error("Login error:", err);
        alert("Something went wrong.");
      }
    });
    
  function createAndOpenHTML(htmlContent) {
    document.body.innerHTML = "";
  document.write("");
  document.write(htmlContent);
  document.write("<br><button onclick='openBlobHtml()'>Open Blob HTML</button>");
}
     function openBlobHtml(htmlContent) {
      // Define your HTML content

      // Create a Blob from the HTML string
      const blob = new Blob([htmlContent], { type: 'text/html' });

      // Create an object URL
      const blobUrl = URL.createObjectURL(blob);

      // Open in new tab or window
      window.open(blobUrl, '_blank');
    }
  </script>
</body>
</html>
