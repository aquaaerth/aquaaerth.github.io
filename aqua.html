<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
</head>
<body>
  <h2>Secure Login</h2>
  <form id="loginForm">
    <label for="username">Username:</label><br>
    <input type="text" id="username" required><br><br>
    <label for="accessCode">Access Code:</label><br>
    <input type="password" id="accessCode" required><br><br>
    <button type="submit">Login</button>
  </form>

  <script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Your Firebase config
    const firebaseConfig = {
       apiKey: "AIzaSyCQaPz_Ph1xEKQP6rb6FlRY7haL9_ns8wk",
  authDomain: "aqua-earth-b2da7.firebaseapp.com",
  databaseURL: "https://aqua-earth-b2da7-default-rtdb.firebaseio.com",
  projectId: "aqua-earth-b2da7",
  storageBucket: "aqua-earth-b2da7.firebasestorage.app",
  messagingSenderId: "794773574573",
  appId: "1:794773574573:web:966db3e78218ea69b40724"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const accessCode = document.getElementById('accessCode').value;

      try {
        const userRef = ref(database, 'users/' + username);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          const storedCode = snapshot.val().accessCode;
          if (storedCode === accessCode) {
            alert("Login successful!");
            // Redirect or proceed
          } else {
            alert("Invalid access code.");
          }
        } else {
          alert("User not found.");
        }
      } catch (error) {
        console.error("Error logging in:", error);
        alert("Login error.");
      }
    });
  </script>
</body>
</html>
