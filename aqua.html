<!DOCTYPE html>
<html>
<head>
  <title>Protected Folder</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial; }
    #protectedContent { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Aqua Earth</h2>
  <div id="loginarea">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>

  <div id="protectedContent">
    <h3>🔒 AquaEarth</h3>
    <ul>

    </ul>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    // 🔧 Your Firebase Config

    const firebaseConfig = {
  apiKey: "AIzaSyASkzRh3RKKWV1TZyHgVK3vC8-N9JknW_w",
  authDomain: "aquaearth-27417.firebaseapp.com",
  projectId: "aquaearth-27417",
  storageBucket: "aquaearth-27417.firebasestorage.app",
  messagingSenderId: "1057475890763",
  appId: "1:1057475890763:web:9a5fb7dae9a7cf573c47ce"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(err => alert(err.message));
    }

    function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .catch(err => alert(err.message));
    }

    function logout() {
      auth.signOut();
        document.getElementById('loginarea').style.display = 'block';
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('protectedContent').style.display = 'block';
        document.getElementById('loginarea').style.display = 'none';
      } else {
        document.getElementById('protectedContent').style.display = 'none';
      }
    });
  </script>
</body>
</html>
