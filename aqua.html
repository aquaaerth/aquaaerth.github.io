<html><head>
  <meta charset="UTF-8">
  <meta name="description" content="Aqua Earth" "="">
  <meta name="keywords" content="Aqua Earth">
  <meta name="author" content="Chuck Konkol">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>AquaEarth - Web/Mobile App Version</title>
</head>
<body>
  <h2>AquaEarth Secure Login</h2>
  <form id="loginForm">
    <label for="username">Login:</label><br>
    <input type="text" id="username" required><br><br>
    <label for="accessCode">Access Code:</label><br>
    <input type="password" id="accessCode" required><br><br>
    <button type="submit">Login</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc,collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyCQaPz_Ph1xEKQP6rb6FlRY7haL9_ns8wk",
  authDomain: "aqua-earth-b2da7.firebaseapp.com",
        projectId: "aqua-earth-b2da7",
  storageBucket: "aqua-earth-b2da7.firebasestorage.app",
  messagingSenderId: "794773574573",
  appId: "1:794773574573:web:966db3e78218ea69b40724"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const accessCode = document.getElementById('accessCode').value;

      try {
        const userRef = doc(db, "users", username);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const storedCode = userSnap.data().accessCode;
          if (storedCode === accessCode) {
            alert("Login successful!");

            // Log successful login
        await addDoc(collection(db, "login_logs"), {
    username: username,
    timestamp: serverTimestamp(),
    status: "success accessing AquaEarth page",
    userAgent: navigator.userAgent
  });
            // Proceed or redirect
            const blob = new Blob([userSnap.data().app], { type: 'text/html' });
            // Create a URL for the Blob
           const url = URL.createObjectURL(blob);
             // Open the URL in a new window
            window.open(url, '_blank');
          } else {
            alert("Incorrect access code.");
          }
        } else {
          alert("User not found.");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Something went wrong.");
      }
    });
  </script>
</body>
</html>
