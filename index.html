<!DOCTYPE html>
<!-- v3.4 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Aqua Earth">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AquaEarth Secure Login</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f9f9f9; margin: 0; padding: 20px; }
    input { width: 300px; font-size: 18px; margin: 5px 0; padding: 6px; text-transform: lowercase; }
    button { font-size: 18px; padding: 8px 14px; margin: 5px; }
    #welcomeDiv { display: none; margin-top: 2rem; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #333; color: #fff; font-size: 12px; padding: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <img src="https://aquavisitorsystem.github.io/aqua.png" width="250px"><br>
  <h1>AquaEarth Secure Login</h1>

  <!-- Login Form -->
  <form id="loginForm">
    <label for="username">Login:</label><br>
    <input type="text" id="username" placeholder="enter aqua userid" required><br><br>
    <label for="accessCode">Access Code:</label><br>
    <input type="password" id="accessCode" placeholder="enter passcode" required><br><br>
    <button type="submit">Login</button>
  </form>

  <!-- Welcome Section -->
  <div id="welcomeDiv">
    <h2 id="welcomeMsg"></h2>
    <button id="launchBtn">Launch AquaEarth</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <footer>AquaEarth v3.4</footer>

  <script type="module" src="home.js"></script>
</body>
</html>
