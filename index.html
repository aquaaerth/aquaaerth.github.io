<!DOCTYPE html>
<!-- v3.7 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AquaEarth Secure Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* ⬅️ stick to top */
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
    }
    #loginForm, #welcomeDiv {
      margin-top: 20px;
    }
    input {
      margin: 5px 0;
    }
    button {
      margin-top: 10px;
    }
    footer {
      margin-top: auto;  /* ⬅️ pushes footer to bottom */
      padding: 10px;
      font-size: 12px;
      color: grey;
      border-top: 1px solid #ddd;
      width: 100%;
      text-align: center;
    }
    footer a {
      color: #4FC3F7;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <img src="https://aquavisitorsystem.github.io/aqua.png" width="250px"><br>
  <h1 style="font-size: 30px;">AquaEarth Secure Login</h1>

  <form id="loginForm">
    <label style="font-size: 20px;" for="username">Login:</label><br>
    <input style="font-size: 20px;background-color: lightyellow; width: 300px; text-transform: lowercase; text-align: left;" 
           placeholder="enter aqua userid | example:ckonkol" type="text" id="username" required><br><br>

    <label style="font-size: 20px;" for="accessCode">Access Code:</label><br>
    <input style="font-size: 20px;background-color: lightyellow; width: 300px; text-align: left;" 
           placeholder="enter passcode" type="password" id="accessCode" required><br><br>

    <button style="font-size: 20px;" id="submit" type="submit">Login</button>
  </form>

  <!-- Help note -->
  <p style="font-size: 14px; color: grey;">
    * See Chuck Konkol to request access, ext. 4574
  </p>

  <div id="welcomeDiv" style="display:none;">
    <h2 id="welcomeMsg"></h2>
    <button id="launchBtn">Launch AquaEarth</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <!-- Footer -->
  <footer>
    AquaEarth Secure Login — Version <strong>v3.7</strong>  
    [<a href="CHANGELOG.md" target="_blank">View Changelog</a>]
  </footer>

  <script type="module" src="home.js"></script>
</body>
</html>
